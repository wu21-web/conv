name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          case "${RUNNER_OS}" in
            Windows) binary="conv.exe" ;;
            *)       binary="conv" ;;
          esac
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/wu21-web/conv/internal/version.Build=${version}" \
            -o "dist/${binary}" ./cmd/conv
          "./dist/${binary}" -v
          {
            echo "### conv ${version}"
            echo
            echo "built \`dist/${binary}\` on ${RUNNER_OS}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: conv-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 2
