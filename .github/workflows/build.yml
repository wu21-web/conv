name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short=12 HEAD)"
          fi
          case "${GOOS}" in
            windows) binary="conv.exe" ;;
            *)       binary="conv" ;;
          esac
          out="dist/${GOOS}_${GOARCH}"
          mkdir -p "${out}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/wu21-web/conv/internal/version.Build=${version}" \
            -o "${out}/${binary}" ./cmd/conv
          go version -m "${out}/${binary}"
          {
            echo "### conv ${version}"
            echo
            echo "built \`${out}/${binary}\` for ${GOOS}/${GOARCH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the native artifact
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: ./dist/${GOOS}_${GOARCH}/conv -v

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: conv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}_${{ matrix.goarch }}/
          if-no-files-found: error
          retention-days: 2
